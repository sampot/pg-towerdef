<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="迷你塔防：戰役／無盡、三塔五級、多敵種首領波、加速與連殺。純前端 Playgrounds SAM。"
    />
    <title>迷你塔防</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <header class="hero">
        <p class="eyebrow">街機</p>
        <h1>迷你塔防</h1>
        <p class="tagline">戰役十五波 · 無盡生存 · 連殺加成</p>
      </header>

      <section class="meter" aria-label="對局狀態">
        <div class="meter-item">
          <span class="label">金幣</span>
          <strong id="gold">150</strong>
        </div>
        <div class="meter-item">
          <span class="label">生命</span>
          <strong id="lives">20</strong>
        </div>
        <div class="meter-item">
          <span class="label">波次</span>
          <strong id="wave">0</strong>
        </div>
        <div class="meter-item">
          <span class="label">得分</span>
          <strong id="score">0</strong>
        </div>
        <div class="meter-item">
          <span class="label">最佳</span>
          <strong id="best">0</strong>
        </div>
        <div class="meter-item">
          <span class="label">連殺</span>
          <strong id="combo">0</strong>
        </div>
      </section>

      <div class="row" role="group" aria-label="模式">
        <button type="button" class="chip is-active" data-mode="campaign" id="mode-campaign">戰役</button>
        <button type="button" class="chip" data-mode="endless" id="mode-endless">無盡</button>
      </div>
      <div class="row" role="group" aria-label="難度">
        <button type="button" class="chip" data-diff="easy">簡單</button>
        <button type="button" class="chip is-active" data-diff="normal">普通</button>
        <button type="button" class="chip" data-diff="hard">困難</button>
      </div>

      <div class="tower-pick" role="group" aria-label="選擇防禦塔">
        <button type="button" class="tower-btn is-active" data-kind="arrow">
          <strong>箭塔</strong><span>55g · 速射</span>
        </button>
        <button type="button" class="tower-btn" data-kind="cannon">
          <strong>炮塔</strong><span>95g · 爆炸</span>
        </button>
        <button type="button" class="tower-btn" data-kind="frost">
          <strong>冰塔</strong><span>75g · 減速</span>
        </button>
      </div>

      <div class="controls">
        <button type="button" id="btn-start">開局</button>
        <button type="button" id="btn-wave" class="secondary" disabled>下一波</button>
        <button type="button" id="btn-speed" class="secondary">×1</button>
        <button type="button" id="btn-mute" class="secondary" aria-pressed="true">音效</button>
      </div>
      <div class="controls sub">
        <button type="button" id="btn-upgrade" class="secondary" disabled>升級</button>
        <button type="button" id="btn-sell" class="secondary" disabled>賣掉</button>
        <button type="button" id="btn-target" class="secondary">優先：最前</button>
        <button type="button" id="btn-auto" class="secondary" aria-pressed="false">自動波</button>
      </div>

      <p id="inspect" class="inspect" hidden></p>
      <p id="status" class="status" role="status">選模式／難度後開局</p>

      <div class="stage">
        <canvas id="game" width="360" height="520" aria-label="塔防地圖"></canvas>
        <div id="fx" class="fx" aria-hidden="true"></div>
      </div>

      <div id="sell-panel" class="panel" hidden>
        <p>確定賣掉這座塔？將退回部分金幣。</p>
        <div class="controls">
          <button type="button" id="sell-yes">確定賣掉</button>
          <button type="button" id="sell-no" class="secondary">取消</button>
        </div>
      </div>

      <details class="rules">
        <summary>怎麼玩</summary>
        <ul>
          <li>選塔種 → 點空地「＋」建造；點塔可升級（最高 5 級）或賣掉。</li>
          <li>箭塔點殺、炮塔範圍、冰塔減速；可切換優先目標與遊戲加速。</li>
          <li>戰役 15 波通關；無盡模式可持續挑戰。連殺越高得分加成越多。</li>
        </ul>
      </details>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
